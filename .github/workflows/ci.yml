# Runs on every pull request and every push to main.
# It uses a throw-away MySQL server; no real secrets are needed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: PHP syntax, unit + feature tests, Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2 (same version as AMPPS)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, curl, zip, fileinfo
          tools: composer

      - name: Install test tools (PHPUnit)
        run: composer install --no-interaction --no-progress

      - name: Check every PHP file for syntax errors
        run: find src templates public tests bin -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run all tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_PASSWORD: ci-only-password
        run: vendor/bin/phpunit

      - name: Check Composer packages for known vulnerabilities
        run: composer audit

      - name: Check that the Docker image builds
        run: docker build -f docker/Dockerfile -t campusbridge-ci .
